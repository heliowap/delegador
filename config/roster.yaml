  - id: devin/swe-2
    papel: barato          # era `forte`; corrigido por evidência, ver nota
    permaslug: null
    mapeamento: ausente
    sondado:
      tool_call: true
      reasoning_content: true
      tokens_base: 552      # maior do roster: prompt injetado pelo backend
      latencia_s: 4.7
    benchmark: null
    humano:
      custo_usd_por_mtok: null
      habilitado: true
    fornecedor:
      # cognition.com/blog/swe-2. Método declarado: resultado público quando
      # existe, senão avaliação interna no harness próprio, reportando o
      # melhor esforço. Assimétrico a favor do SWE-2 — ler como teto.
      frontiercode_1_1: 0.500      # Fable 5.1: 0.509 | GPT-6 Astra: 0.533
      deepswe_1_1: 0.730           # Fable 5.1: 0.674 | GPT-6 Astra: 0.741
      terminal_bench_2_1: 0.928    # Fable 5.1: 0.914 — melhor do comparativo
      terminal_bench_4: 0.273      # Fable 5.1: 0.558 | GPT-6 Astra: 0.579
      passos_ate_primeira_edicao: 18
    eval:
      # Medido contra as tarefas deste próprio plano, por código.
      # Ver docs/handoffs/2026-09-20-eval-swe2-vs-glm-closeout.md
      as_of: "2026-09-20"
      modelo_testado: swe-2-max
      resultado: parcial_sem_confronto
      operacao:
        tarefas_verdes: 3          # 9, 10, 11 — sem recusa
        tarefas_tentadas: 4        # parou na 12
        tempo_por_tarefa_s: [376, 543, 152]
        linhas_por_tarefa: [957, 506, 230]
        parou_em: 12
        causa_da_parada: recusa_de_permissao_dupla   # não incapacidade
      capacidade:
        tarefas_nuas: [12, 13, 14]
        passou: 0
        alterou_teste: 0           # nenhuma alteração de teste em 3 tarefas
        causa: recusa_de_permissao # as 3 morreram no `go test` do Step 2
        valido: false              # ver defeito de isolamento no closeout
      recusas_reais: 5             # em 9 invocações registradas
      custo_usd: 0.0               # promoção gratuita
      conclusivo: false
      nota_do_eval: >
        Sem o braço do GLM, não houve confronto. Não use estes números para
        escolher padrão de cascata — eles dizem o que o swe-2-max fez sozinho,
        não que ele é melhor ou pior que o glm.
    nota: >
      Classificado `barato`, não `forte`. Três fontes independentes convergem:
      (1) o próprio fornecedor publica 0.273 no Terminal-Bench 4 contra 0.558
      do Fable 5.1 — forte no benchmark saturado (TB2.1), colapso no sucessor
      difícil, assinatura de otimização específica; (2) o benchmark de terceiro
      dá ao Fable 5.1 o maior coding_index das 149 entradas; (3) observação
      direta em 2026-09-20 — executou 8 tarefas deste plano com fidelidade,
      mas 98% do código estava escrito no plano. CORRIGIDO em 2026-09-20 pelo
      eval: a afirmação anterior de que "ele morreu na tarefa 9, a primeira que
      exigia montagem própria" está errada — a tarefa 9 fechou verde em 6m16s
      (957 linhas, 13 arquivos, sem recusa), e a 10 e a 11 também. Ele parou na
      12, por recusa de permissão, não por incapacidade. A classificação
      `barato` continua de pé pelas fontes (1) e (2), não pela (3).
      A Cognition o posiciona por
      eficiência: 64% mais barato que o Fable com paridade no FrontierCode,
      primeira edição real em 18 passos contra 48 do antecessor. Isso é
      argumento de camada barata, e foi assim que reclassifiquei.

      NÃO MEDIDO pelo OpenRouter — nenhum permaslug com "swe" existe nas 256
      entradas. Elegível por viabilidade e custo, nunca por índice, e o
      relatório precisa dizer isso quando ele for escolhido. Ausência de nota
      de terceiro não é nota baixa. Emite reasoning_content.

      O gratuito é promocional (setembro/2026). Quando acabar, este modelo
      precisa de `custo_usd_por_mtok` real ou sai do roster.
