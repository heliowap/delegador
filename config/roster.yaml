# Roster de delegação — modelos habilitados para receber tarefa.
#
# Este arquivo é curadoria humana, não descoberta automática. O sistema só
# delega para o que está aqui. Nada entra por estar disponível no proxy.
#
# Três origens de dado, e elas não se misturam:
#
#   sondado:   medido por mim contra o proxy local em 2026-09-20. Perde
#              validade sem aviso — `doctor --probe` remede.
#   benchmark: OpenRouter /api/v1/benchmarks, as_of 2026-09-20T00:03Z.
#              Fonte externa, sobre uma configuração que pode não ser a sua.
#   humano:    você preenche. O sistema nunca escreve aqui.
#
# `custo_usd_por_mtok` é o SEU custo de servir, não o preço do OpenRouter.
# Está como `null` de propósito: o roteador trata null como "não elegível
# para decisão por custo" em vez de adivinhar zero.

